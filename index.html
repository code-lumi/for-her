<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Question for You 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts" aria-hidden="true">💕 💗 💖 💕</div>

    <main class="card">
        <div class="emoji" id="mainEmoji">💌</div>

        <h1 id="question">Hey, beautiful! 💗</h1>

        <p id="message">
            I've got a little question for you...
        </p>

        <h2 id="questionText">Do you like me? 🥹</h2>

        <div class="buttons" id="buttons">
            <button id="yesBtn" type="button">Yes! 💖</button>
            <button id="noBtn" type="button">No 🙈</button>
        </div>

        <p class="footer" id="footer">
            Made with a little courage and lots of ❤️
        </p>
    </main>

    <script src="script.js"></script>
</body>
</html>
